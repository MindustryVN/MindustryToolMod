name: spotless

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  spotless:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: 17
          distribution: temurin

      - name: Run Spotless Check
        run: ./gradlew spotlessCheck
