name: mod-release

on:
  push:

jobs:
  buildJar:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up PATH
        run: |
          echo "${ANDROID_HOME}/build-tools/34.0.0" >> $GITHUB_PATH

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: 17
          distribution: temurin

      - name: Build mod jar
        run: ./gradlew :mod:deploy

      - name: Upload built jar file
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}
          path: mod/build/libs/${{ github.event.repository.name }}.jar

      - name: Install hjson
        run: npm install -g hjson

      - name: Read version
        id: version
        run: |
          VERSION=$(hjson -j mod.hjson | jq -r .version)
          if [[ "${{ github.ref_name }}" != "main" ]]; then
            VERSION="${VERSION}-beta"
          fi
          echo "tag=${VERSION}" >> $GITHUB_OUTPUT

      - uses: "marvinpinto/action-automatic-releases@latest"
        with:
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          automatic_release_tag: "${{ steps.version.outputs.tag }}"
          prerelease: ${{ github.ref_name != 'main' }}
          title: "${{ steps.version.outputs.tag }}"
          files: |
            mod/build/libs/${{ github.event.repository.name }}.jar
