name: solim-test

on:
  pull_request:
    paths:
      - 'solim/**'
      - '.github/workflows/solim-test.yml'
  push:
    paths:
      - 'solim/**'
      - '.github/workflows/solim-test.yml'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: 17
          distribution: temurin
      - name: Test solim
        run: ./gradlew :solim:test
