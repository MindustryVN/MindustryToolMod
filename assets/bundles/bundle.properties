# Title of the dialog shown when a newer mod version is available.
# Displayed as the header of the update-available dialog.
update.dialog.title=Update Available
# Message informing the user that a new version is available.
# Displayed in the update dialog's version banner.
# {0} is the current version (colored red), {1} is the latest version (colored green).
update.message.new-version=New version available: {0} -> {1}
# Label for the button that dismisses the update dialog without updating.
# Displayed on the Cancel button in the update dialog.
update.button.cancel=Cancel
# Label for the button that starts the mod update via GitHub import.
# Displayed on the Update button in the update dialog.
update.button.update=Update
# Label showing the summed download count for a release's assets.
# Displayed under each release entry in the changelog.
# {0} is the total download count (integer).
update.changelog.download-count=Download count: {0}
# Error message shown when fetching release notes fails without HTTP details.
# Displayed as changelog fallback when GitHub releases cannot be fetched.
update.error.fetch-releases=Could not fetch release notes.
# Error message shown when fetching release notes fails with HTTP detail.
# Displayed as changelog fallback; {0} is the HTTP error body/status text.
update.error.fetch-releases-with-status=Could not fetch release notes: {0}
# Error message shown when release notes JSON cannot be parsed.
# Displayed as changelog fallback when GitHub response is malformed.
update.error.parse-releases=Could not parse release notes.
# Placeholder text shown when a release has no body/description.
# Displayed in the changelog entry when GitHub release body is empty.
update.label.no-description=No description provided.
# Log/status message indicating the mod is already up to date.
# Used in log output when no update is required; may be shown in UI in future.
update.status.up-to-date=Mod up to date
# Log/status message indicating an update is required.
# Used in log output when a newer version is found.
# {0} is the current version, {1} is the latest version.
update.status.require-update=Mod requires update, current version: {0}, latest version: {1}
# Displayed on the login button when the user is not authenticated.
# Shown in the top-right auth overlay when no user session is loaded.
auth.login=Login
# Title of the login dialog shown during the authentication flow.
# Displayed as the header of AuthLoginDialog.
auth.login.dialog-title=Login
# Label for the cancel button in the login dialog.
# Displayed on the Cancel button; dismisses the dialog and cancels the pending login.
auth.login.cancel=Cancel
# Message shown inside the login dialog while the login URL is being fetched.
# Displayed as a loading indicator before the login link appears.
auth.login.loading=Generating login link...
# Label for the button that displays the login URL.
# Displayed after getLoginUri succeeds; clicking copies the URL to clipboard.
# {0} is the login URL returned by the server.
auth.login.login-url={0}
# Toast message shown when the login URL is copied to the clipboard.
# Displayed briefly after clicking the login URL button.
auth.login.copied=Copied
# Toast message shown when login succeeds after polling the login token.
# Displayed after pollLoginToken returns tokens and session is fetched.
auth.login.success=Login successful!
# Error message shown when login fails or the polling times out.
# Displayed as an exception dialog when loginFuture completes exceptionally.
auth.login.failed=Login failed or timed out.
# Error detail shown when login polling exceeds the timeout.
# Displayed when pollLoginToken times out after 60 seconds.
auth.login.timeout=Login timed out. Please try again.
# Label for the logout action.
# Used as a fallback for logout-related UI where no specific context is needed.
auth.logout=Logout
# Title of the confirmation dialog asking the user to confirm logout.
# Displayed as the header of the logout confirm dialog.
auth.logout.confirm-title=Logout
# Message inside the logout confirmation dialog.
# Displayed when an authenticated user clicks their name/avatar; {0} is the logged-in user's display name.
auth.logout.confirm-message=Logged in as {0}\nDo you want to logout?
# Label shown in the auth overlay while the user session is being loaded.
# Displayed when SessionLoadEvent isLoading=true.
auth.session.loading=Loading...
# Label prefix shown when the session fails to load.
# Displayed in the auth overlay when SessionLoadEvent carries an error, before the error message.
auth.session.error=Error
# Label for the retry button shown when session loading fails.
# Displayed in the auth overlay error state; clicking re-initiates login.
auth.session.retry=Retry
# Title of the dialog asking the user to send a crash report.
# Displayed as the header of CrashReportDialog when a recent crash is detected.
crash-report.title=Crash Report
# Message explaining that a crash was detected and asking for consent to send the report.
# Displayed as the main body text in CrashReportDialog.
crash-report.content=It looks like the game crashed. Would you like to send a crash report?
# Label for the checkbox that toggles whether the crash report should be sent.
# Displayed next to the checkbox in CrashReportDialog; persisted via mindustrytool.crash-report.send.
crash-report.send=Send crash report

# Placeholder text displayed in the feature search filter field.
# Displayed in FeatureSettingDialog when the search input is empty.
feature.search.placeholder=Search features...

# Text displayed when no features match the search query.
# Displayed centered in the scroll pane of FeatureSettingDialog.
feature.search.empty=No features found.

# Label for the button that re-enables all previously enabled features.
# Displayed on the re-enable button in FeatureSettingDialog.
feature.button.re-enable=Re-enable Features

# Tooltip text explaining the purpose of the re-enable button.
# Displayed when hovering over the re-enable button in FeatureSettingDialog.
feature.button.re-enable.tooltip=Re-enable features that were disabled after a crash.

# Label for the button that opens Discord or copies the invite link to report bugs.
# Displayed in the bottom action bar of FeatureSettingDialog.
feature.button.report-bug=Report Bug

# Message displayed in a fade notification when the Discord invite URL is copied to clipboard.
# Displayed when opening the browser fails in FeatureSettingDialog.
feature.toast.copied=Copied to clipboard!

# Status label indicating that a feature is currently enabled.
# Displayed in green at the bottom of a FeatureCard.
feature.status.enabled=Enabled

# Status label indicating that a feature is currently disabled.
# Displayed in red at the bottom of a FeatureCard.
feature.status.disabled=Disabled

# Tooltip for the settings gear button on a feature card.
# Displayed when hovering over the settings icon button on FeatureCard.
feature.button.settings=Settings

# Tooltip for the button that opens a feature's main dialog.
# Displayed when hovering over the open dialog icon button on FeatureCard.
feature.button.open-dialog=Open Dialog

# Tooltip for the help button on a feature card.
# Displayed when hovering over the help question mark button on FeatureCard.
feature.button.help=Help

# Title of the help dialog displaying documentation for a feature.
# Displayed as the header of FeatureHelpDialog.
# {0} is the name of the feature.
feature.help.title=Help: {0}

# Fallback text shown when a feature does not have help documentation available.
# Displayed inside FeatureHelpDialog when no help key is provided.
feature.help.no-description=No help documentation is available for this feature.

# Display name of the custom background feature.
# Displayed on the feature card in FeatureSettingDialog.
feature.background.name=Custom Background

# Short description of the custom background feature.
# Displayed on the feature card in FeatureSettingDialog.
feature.background.description=Customize the game main menu background image.

# Help text explaining how to use the custom background feature.
# Displayed in FeatureHelpDialog when inspecting the background feature.
feature.background.help=Allows you to select a custom PNG image to replace or blend with the main menu background.

# Title of the settings dialog for configuring the custom background.
# Displayed as the header of BackgroundSettingsDialog.
feature.background.settings.title=Background Settings

# Button label for selecting a background image from disk.
# Displayed in BackgroundSettingsDialog.
feature.background.settings.select-image=Select Background Image

# Label for the background opacity slider control in BackgroundSettingsDialog.
# Displayed next to the opacity slider.
feature.background.settings.opacity=Opacity

# Label showing the currently selected background file name in BackgroundSettingsDialog.
# {0} is the name of the file or "None".
feature.background.settings.current-file=Current File: {0}

# Placeholder text when no custom background image is selected.
# Displayed in BackgroundSettingsDialog.
feature.background.settings.no-file=None

# Button label for resetting or clearing the custom background back to default.
# Displayed in BackgroundSettingsDialog.
feature.background.settings.reset=Reset Background

# Error message displayed when applying a background image fails.
# Displayed when an exception occurs while loading or applying a custom background.
feature.background.error.apply=Failed to apply background image.

# Display name of the Quick Access HUD feature.
# Displayed on the feature card in FeatureSettingDialog.
feature.quick-access.name=Quick Access HUD

# Short description of the Quick Access HUD feature.
# Displayed on the feature card in FeatureSettingDialog.
feature.quick-access.description=Provides a quick access overlay HUD to toggle features and open settings.

# Help text explaining how to use the Quick Access HUD feature.
# Displayed in FeatureHelpDialog when inspecting the Quick Access feature.
feature.quick-access.help=Allows toggling features and opening settings via an overlay HUD on screen. Drag the move icon to reposition the HUD.

# Title of the settings dialog for configuring the Quick Access HUD.
# Displayed as the header of QuickAccessSettingsDialog.
feature.quick-access.settings.title=Quick Access Settings

# Label for the HUD opacity slider control in QuickAccessSettingsDialog.
# Displayed next to the opacity slider.
feature.quick-access.settings.opacity=Opacity

# Label for the HUD scale slider control in QuickAccessSettingsDialog.
# Displayed next to the scale slider.
feature.quick-access.settings.scale=Scale

# Label for the HUD columns slider control in QuickAccessSettingsDialog.
# Displayed next to the column count slider.
feature.quick-access.settings.columns=Columns

# Header label for the feature visibility list in QuickAccessSettingsDialog.
# Displayed above the checklist of features to show on the HUD.
feature.quick-access.settings.visible-features=Visible Features

# Label for the button that resets the HUD position back to default.
# Displayed on the reset position button in QuickAccessSettingsDialog.
feature.quick-access.settings.reset-position=Reset Position

# Display name of the chat feature.
# Displayed on the feature card in FeatureSettingDialog.
feature.chat.name=Chat

# Short description of the chat feature.
# Displayed on the feature card in FeatureSettingDialog.
feature.chat.description=Live in-game chat connected to the Mindustry Tool community.

# Help text explaining how to use the chat feature.
# Displayed in FeatureHelpDialog when inspecting the chat feature.
feature.chat.help=Opens a live chat overlay while playing. Drag the move handle to reposition the window, use the collapse button to minimize it into a badge, and press Enter to send a message or Escape to collapse the chat.

# Title of the settings dialog for configuring the chat overlay.
# Displayed as the header of ChatSettingsDialog.
feature.chat.settings.title=Chat Settings

# Label for the chat overlay opacity slider in ChatSettingsDialog.
# Displayed next to the opacity slider; range 20% to 100%.
feature.chat.settings.opacity=Opacity

# Label for the chat overlay scale slider in ChatSettingsDialog.
# Displayed next to the scale slider; range 50% to 150%.
feature.chat.settings.scale=Scale

# Label for the expanded chat window width slider in ChatSettingsDialog.
# Displayed next to the width slider; {0} is the resulting percentage of the screen width.
feature.chat.settings.width=Width

# Label for the expanded chat window height slider in ChatSettingsDialog.
# Displayed next to the height slider; {0} is the resulting percentage of the screen height.
feature.chat.settings.height=Height

# Label for the button that resets the chat window position back to the default corner.
# Displayed on the reset position button in ChatSettingsView.
feature.chat.settings.reset-position=Reset Position

# Label for the button that resets chat appearance settings to their defaults.
# Displayed on the reset appearance button in ChatSettingsView.
feature.chat.settings.reset-appearance=Reset Appearance

# Placeholder text shown inside the chat message input field when it is empty.
# Displayed as faint hint text in the SolimTextField of ChatInputView.
feature.chat.ui.placeholder=Message...

# Label of the button that sends the current chat message.
# Displayed on the send button in ChatInputView.
feature.chat.ui.send=Send

# Header label for the channel list pane of the chat window.
# Displayed above the list of channels in ChatChannelListView.
feature.chat.ui.channels=Channels

# Header label for the online members pane of the chat window.
# Displayed above the list of online users in ChatUserListView.
feature.chat.ui.members=Members

# Label of the tab that shows the messages pane on mobile layouts.
# Displayed on the tabbed navigation bar of the chat window on mobile devices.
feature.chat.ui.messages=Messages

# Text shown in the header when the chat stream is connected to the server.
# Used as a tooltip/title for the connection indicator.
feature.chat.ui.connected=Connected

# Text shown in the header when the chat stream is offline or reconnecting.
# Used as a tooltip/title for the connection indicator when disconnected.
feature.chat.ui.disconnected=Offline

# Tooltip for the button that collapses the expanded chat window into the floating badge.
# Displayed when hovering the collapse button in the chat window header.
feature.chat.ui.collapse=Collapse

# Tooltip for the button that opens the chat settings dialog.
# Displayed when hovering the settings button in the chat window header.
feature.chat.ui.settings=Settings

# Empty state text shown when no chat channels are available.
# Displayed inside ChatChannelListView when the channel list is empty.
feature.chat.ui.empty-channels=No channels available.

# Empty state text shown when the active channel has no messages yet.
# Displayed inside ChatMessageListView when there are no messages to show.
feature.chat.ui.empty-messages=No messages yet.

# Toast text shown when sending a chat message fails.
# Displayed as a brief notification after a send attempt fails.
feature.chat.ui.send-failed=Message failed to send.


